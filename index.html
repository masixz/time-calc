<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>Study</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f7f8fb;font-family:-apple-system,sans-serif;padding:calc(env(safe-area-inset-top) + 18px) 15px 30px}.w{max-width:620px;margin:auto}.date,.muted{color:#929baa;font-size:12px}.date{text-align:center;text-transform:uppercase}.hero{text-align:center;padding:18px}.big{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums}.bar{height:8px;background:#20252e;border-radius:9px;margin:12px auto;max-width:360px;overflow:hidden}.fill{height:100%;background:white}.card{background:#141821;border:1px solid #282e39;border-radius:20px;padding:17px;margin:12px 0}.active{border-color:#737c8c}.row{display:flex;justify-content:space-between;align-items:center}.name{font-size:19px;font-weight:750}.time{font-size:23px;font-weight:750;font-variant-numeric:tabular-nums}button{width:100%;margin-top:13px;padding:12px;border:0;border-radius:13px;font-size:16px;font-weight:700}.active button,.secondary{background:#29303a;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{background:#0e1218;border-radius:13px;padding:10px}.val{font-weight:750;margin-top:4px}.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:14px}.day{aspect-ratio:1;border-radius:3px;background:#1b2028}.l1{background:#3b424e}.l2{background:#707986}.l3{background:#aeb4bd}.l4{background:#f3f4f6}.session{border-top:1px solid #282e39;padding:10px 0}.session:first-child{border:0}input{width:100%;padding:10px;margin-top:7px;border-radius:10px;border:1px solid #303744;background:#0e1218;color:white}.danger{background:transparent;color:#ff6b63;border:1px solid #4a292c}</style></head>
<body><div class="w"><div class="date" id="date"></div><div class="hero"><div class="big" id="total"></div><div class="muted" id="goalText"></div><div class="bar"><div class="fill" id="fill"></div></div></div><div id="timers"></div>
<div class="card"><b>Темп</b><div class="grid" style="margin-top:12px"><div class="box"><div class="muted">7 дней</div><div class="val" id="week"></div></div><div class="box"><div class="muted">Среднее</div><div class="val" id="avg"></div></div><div class="box"><div class="muted">Streak</div><div class="val" id="streak"></div></div></div><div class="muted" style="margin-top:10px">Streak: минимум 30 минут реальной учёбы за день.</div><div class="heat" id="heat"></div></div>
<div class="card"><b>Последние сессии</b><div id="sessions" style="margin-top:8px"></div></div>
<div class="card"><b>Настройки</b><div class="muted" style="margin-top:12px">Дневная цель, часов</div><input id="goal" type="number" min=".5" max="16" step=".5"><button class="secondary" onclick="backup()">Export backup</button><button class="secondary" onclick="imp.click()">Import backup</button><input id="imp" type="file" accept=".json" style="display:none"><button class="danger" onclick="resetAll()">Сбросить всё</button></div></div>
<script>
const S=[['physics','Physics'],['chemistry','Chemistry'],['biology','Biology']],K='studyV2';const fresh=()=>({totals:{physics:0,chemistry:0,biology:0},daily:{},sessions:[],active:null,goal:5});let D;try{D=JSON.parse(localStorage.getItem(K))||fresh()}catch{D=fresh()}const save=()=>localStorage.setItem(K,JSON.stringify(D));
function key(t=Date.now()){let d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function ensure(k){D.daily[k]??={physics:0,chemistry:0,biology:0}}
function add(s,a,b){let c=a;while(c<b){let d=new Date(c),n=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime(),e=Math.min(b,n),q=(e-c)/1000;ensure(key(c));D.daily[key(c)][s]=(D.daily[key(c)][s]||0)+q;D.totals[s]=(D.totals[s]||0)+q;c=e}}
function stop(n=Date.now()){if(!D.active)return;let a=D.active;add(a.s,a.at,n);D.sessions.unshift({s:a.s,a:a.at,b:n,q:(n-a.at)/1000});D.sessions=D.sessions.slice(0,500);D.active=null;save()}function toggle(s){let n=Date.now();if(D.active){let same=D.active.s===s;stop(n);if(same)return render()}D.active={s:s,at:n};save();render()}
function live(s){return D.active&&(!s||D.active.s===s)?(Date.now()-D.active.at)/1000:0}function day(k,s){if(!D.daily[k])return 0;return s?D.daily[k][s]||0:S.reduce((a,x)=>a+(D.daily[k][x[0]]||0),0)}function today(s){return day(key(),s)+live(s)}
function keys(n){let a=[],d=new Date();d.setHours(12,0,0,0);for(let i=0;i<n;i++){let z=new Date(d);z.setDate(d.getDate()-i);a.push(key(z))}return a}function fmt(q,sec=false){q=Math.floor(q);let h=Math.floor(q/3600),m=Math.floor(q%3600/60),s=q%60;return sec?String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'):h+'h '+String(m).padStart(2,'0')+'m'}
function streak(){let n=0,d=new Date();d.setHours(12,0,0,0);for(let i=0;i<2000;i++){let z=new Date(d);z.setDate(d.getDate()-i);let q=day(key(z))+(i===0?live():0);if(q>=1800)n++;else if(i===0)continue;else break}return n}
function render(){date.textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});let t=S.reduce((a,x)=>a+today(x[0]),0);total.textContent=fmt(t,true);goalText.textContent=fmt(t)+' / '+D.goal+'h сегодня';fill.style.width=Math.min(100,t/(D.goal*3600)*100)+'%';timers.innerHTML=S.map(x=>{let a=D.active?.s===x[0];return '<div class="card '+(a?'active':'')+'"><div class="row"><div class="name">'+x[1]+'</div><div class="time">'+fmt(today(x[0]),true)+'</div></div><button onclick="toggle(\''+x[0]+'\')">'+(a?'Pause':'Start')+'</button></div>'}).join('');let w=keys(7).reduce((a,k)=>a+day(k),0)+live();week.textContent=fmt(w);avg.textContent=fmt(w/7);streak.textContent=streak()+' d';heat.innerHTML=keys(56).reverse().map(k=>{let q=day(k),l=q>=10800?4:q>=7200?3:q>=3600?2:q>=1800?1:0;return '<div class="day l'+l+'"></div>'}).join('');sessions.innerHTML=D.sessions.slice(0,8).map(x=>'<div class="session row"><span>'+S.find(y=>y[0]===x.s)[1]+'<br><span class="muted">'+new Date(x.a).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</span></span><span>'+fmt(x.q)+'</span></div>').join('')||'<span class="muted">Нет завершённых сессий</span>';goal.value=D.goal}
goal.onchange=()=>{D.goal=+goal.value||5;save();render()};function backup(){let b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='study-backup-'+key()+'.json';a.click()}imp.onchange=async()=>{try{D=JSON.parse(await imp.files[0].text());save();render()}catch{alert('Неверный файл')}};function resetAll(){if(confirm('Удалить всю статистику?')){D=fresh();save();render()}}function checkpoint(){if(D.active){let n=Date.now();add(D.active.s,D.active.at,n);D.active.at=n;save()}}setInterval(render,1000);addEventListener('pagehide',checkpoint);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')checkpoint()});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));render();
</script></body></html>
